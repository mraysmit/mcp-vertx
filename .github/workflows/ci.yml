name: Build and conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 verification and MCP conformance
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify repeatable executable packaging
        shell: pwsh
        run: .\scripts\verify-packaging.ps1

      - name: Verify with Maven
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          & mvn --batch-mode --no-transfer-progress clean verify 2>&1 |
            Tee-Object -FilePath logs/maven-verify.log
          $mavenExit = $LASTEXITCODE
          if ($mavenExit -ne 0) { exit $mavenExit }

      - name: Run targeted MCP conformance checks
        shell: pwsh
        run: .\scripts\run-conformance.ps1

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mcp-vertx-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/
            target/surefire-reports/
            target/site/jacoco/
            target/mcp-vertx-0.3.0-SNAPSHOT.jar
