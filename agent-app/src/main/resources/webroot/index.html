<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline — vertx5-mcp</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<div id="loading">Loading pipeline configuration…</div>
<div id="error"></div>
<div id="app" style="display:none">
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;">
    <h1>Pipeline</h1>
    <button id="yaml-btn" onclick="openYaml()" style="background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;color:var(--accent);padding:4px 12px;font-family:'SFMono-Regular',Consolas,monospace;">📄 pipeline.yaml</button>
  </div>
  <p class="subtitle">Live view of <code>pipeline.yaml</code> — loaded from <code>/api/pipeline</code></p>

  <div class="layout-row">
    <div class="main-col">
      <div class="pipeline-container" id="pipeline"></div>
    </div>
    <div class="sidebar" id="sidebar"></div>
  </div>
</div>

<!-- Tool detail panel -->
<div id="tool-overlay" onclick="closeToolPanel()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200"></div>
<div id="tool-panel" style="display:none;position:fixed;top:0;right:0;height:100%;width:420px;max-width:95vw;background:#161b22;border-left:1px solid #30363d;z-index:201;overflow-y:auto;padding:24px 24px 40px;box-sizing:border-box">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
    <span id="tool-panel-title" style="font-size:15px;font-weight:600;color:#e6edf3"></span>
    <button onclick="closeToolPanel()" style="background:none;border:none;color:#8b949e;cursor:pointer;font-size:18px;line-height:1">✕</button>
  </div>
  <div id="tool-panel-body"></div>
</div>

<!-- YAML drawer -->
<div id="yaml-overlay" onclick="closeYaml()" style="display:none"></div>
<div id="yaml-drawer">
  <div id="yaml-drawer-header">
    <span>📄 pipeline.yaml</span>
    <button onclick="closeYaml()" id="yaml-close">✕</button>
  </div>
  <pre id="yaml-content"></pre>
</div>

<script>
(function() {
  const API = '/api/pipeline';
  let toolDetails = {}; // name -> {name, description, schema}

  Promise.all([
    fetch(API).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    fetch('/api/tools').then(r => r.ok ? r.json() : []).catch(() => [])
  ])
    .then(([cfg, toolList]) => {
      toolList.forEach(t => { toolDetails[t.name] = t; });
      render(cfg);
    })
    .catch(err => {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.innerHTML = '<p>Could not load pipeline config from <code>' + API + '</code></p>'
        + '<p style="margin-top:8px;font-size:13px;color:#8b949e">' + err + '</p>';
    });

  function arrow() {
    return '<div class="connector"><svg width="24" height="24" viewBox="0 0 24 24">'
      + '<line x1="12" y1="2" x2="12" y2="18" stroke="#30363d" stroke-width="2"/>'
      + '<polygon points="6,16 12,22 18,16" fill="#30363d"/>'
      + '</svg></div>';
  }

  function chip(text) {
    return '<span class="meta-chip">' + esc(text) + '</span>';
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function render(cfg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';

    const p = document.getElementById('pipeline');
    let html = '';

    // ── Delegated click handler for tool cards ───────────────────
    p.addEventListener('click', function(e) {
      const card = e.target.closest('[data-tool]');
      if (card) openToolPanel(card.dataset.tool);
    });

    // ── 1. HTTP Ingress ─────────────────────────────────────────
    html += '<div class="node">'
      + '<div class="node-header">'
      +   '<span class="node-badge badge-http">HTTP</span>'
      +   '<span class="node-title">HttpApiVerticle</span>'
      + '</div>'
      + '<div class="node-desc">Receives POST requests, validates required fields, sanitises payload, dispatches to event bus.</div>'
      + '<div class="node-meta">'
      +   chip('POST ' + cfg.http.route)
      +   chip('port ' + cfg.http.port)
      +   chip('timeout ' + cfg.http.requestTimeoutMs + 'ms')
      + '</div>'
      + '</div>';

    html += arrow();

    // ── 2. Event Bus (inbound) ──────────────────────────────────
    html += '<div class="node">'
      + '<div class="node-header">'
      +   '<span class="node-badge badge-bus">Event Bus</span>'
      +   '<span class="node-title">' + esc(cfg.addresses.inbound) + '</span>'
      + '</div>'
      + '<div class="node-desc">Inbound event bus address — request/reply from HTTP API to deterministic processor.</div>'
      + '<div class="node-meta">'
      +   chip('schema: ' + cfg.schema.caseIdField)
      +   (cfg.schema.requiredFields || []).map(f => chip('required: ' + f)).join('')
      + '</div>'
      + '</div>';

    html += arrow();

    // ── 3. Deterministic Processor ──────────────────────────────
    html += '<div class="node">'
      + '<div class="node-header">'
      +   '<span class="node-badge badge-handler">Processor</span>'
      +   '<span class="node-title">DeterministicFailureProcessorVerticle</span>'
      + '</div>'
      + '<div class="node-desc">Matches the failure reason against deterministic handlers. If no match, forwards to the agent.</div>'
      + '</div>';

    html += arrow();

    // ── 4. Decision ─────────────────────────────────────────────
    html += '<div class="decision"><div class="diamond">Reason matches a handler?</div></div>';

    // ── 5. Branch: Handlers (left) vs Agent (right) ─────────────
    html += '<div class="branch-row">';

    // Left: Handlers
    html += '<div class="branch-col">';
    html += '<div class="branch-label" style="color:var(--green)">✓ Yes — Deterministic</div>';
    html += '<div class="handler-list">';
    (cfg.handlers || []).forEach(h => {
      let desc = 'Type: ' + h.type;
      if (h.params) {
        desc += ' — ' + Object.entries(h.params).map(([k,v]) => k + '=' + v).join(', ');
      }
      html += '<div class="mini-card">'
        + '<div class="mini-card-title">'
        + '<span class="node-badge badge-handler" style="font-size:10px;margin-right:6px">Handler</span>'
        + esc(h.reason) + '</div>'
        + '<div class="mini-card-desc">' + esc(desc) + '</div>'
        + '</div>';
    });
    html += '</div></div>';

    // Right: Agent
    html += '<div class="branch-col">';
    html += '<div class="branch-label" style="color:var(--purple)">✗ No — Agent Boundary</div>';

    // Agent Runner
    html += '<div class="node" style="margin-bottom:0">'
      + '<div class="node-header">'
      +   '<span class="node-badge badge-agent">Agent</span>'
      +   '<span class="node-title">AgentRunnerVerticle</span>'
      + '</div>'
      + '<div class="node-desc">Step-limited agent loop. Asks the LLM what to do, executes tool calls until done.</div>'
      + '<div class="node-meta">'
      +   chip('maxSteps ' + cfg.agent.maxSteps)
      +   chip('timeout ' + cfg.agent.timeoutMs + 'ms')
      +   chip('address: ' + cfg.addresses.agent)
      + '</div>'
      + '</div>';

    html += arrow();

    // LLM Client
    html += '<div class="node" style="margin-bottom:0">'
      + '<div class="node-header">'
      +   '<span class="node-badge badge-llm">LLM</span>'
      +   '<span class="node-title">LlmClient — ' + esc(cfg.llm.type) + '</span>'
      + '</div>'
      + '<div class="node-desc">Decides the next action: <code>{ intent, tool, args, stop }</code></div>'
      + '</div>';

    html += arrow();

    // Tools
    html += '<div class="tool-list">';
    (cfg.tools || []).forEach(t => {
      // find resolved tool by type alias — toolDetails is keyed by tool name,
      // so we look for any entry whose type alias matches
      const resolvedName = Object.keys(toolDetails).find(name => {
        const alias = t.type;
        return name.includes(alias.replace('-','')) ||
               (alias === 'publish-event'  && name === 'events.publish') ||
               (alias === 'raise-ticket'   && name === 'case.raiseTicket') ||
               (alias === 'lookup'         && name === 'data.lookup') ||
               (alias === 'classify'       && name === 'case.classify') ||
               (alias === 'notify'         && name === 'comms.notify');
      });
      const hasDetail = !!resolvedName;
      html += '<div class="mini-card' + (hasDetail ? ' mini-card-clickable' : '') + '"'
        + (hasDetail ? ' data-tool="' + esc(resolvedName) + '" title="Click for details"' : '')
        + '>'
        + '<div class="mini-card-title">'
        + '<span class="node-badge badge-tool" style="font-size:10px;margin-right:6px">Tool</span>'
        + esc(resolvedName || t.type)
        + (hasDetail ? '<span style="float:right;font-size:11px;color:#8b949e;margin-top:1px">ℹ︎</span>' : '')
        + '</div>'
        + (hasDetail ? '<div style="font-size:11px;color:#8b949e;margin-top:4px">' + esc(toolDetails[resolvedName].description) + '</div>' : '')
        + '</div>';
    });
    html += '</div>'

    html += '</div>'; // branch-col
    html += '</div>'; // branch-row

    html += arrow();

    // ── 6. Event Sink ───────────────────────────────────────────
    html += '<div class="node">'
      + '<div class="node-header">'
      +   '<span class="node-badge badge-event">Events</span>'
      +   '<span class="node-title">EventSinkVerticle</span>'
      + '</div>'
      + '<div class="node-desc">Receives domain events on the event bus and logs them.</div>'
      + '<div class="node-meta">'
      +   chip('address: ' + cfg.addresses.events)
      + '</div>'
      + '</div>';

    // ── 7. MCP Server (if enabled) ──────────────────────────────
    if (cfg.mcp && cfg.mcp.enabled) {
      html += arrow();
      html += '<div class="node">'
        + '<div class="node-header">'
        +   '<span class="node-badge badge-mcp">MCP</span>'
        +   '<span class="node-title">McpServerVerticle</span>'
        + '</div>'
        + '<div class="node-desc">Exposes tools via Model Context Protocol — Streamable HTTP (2025-03-26) + legacy SSE (2024-11-05).</div>'
        + '<div class="node-meta">'
        +   chip('port ' + cfg.mcp.port)
        +   (cfg.mcp.basePath ? chip('basePath ' + cfg.mcp.basePath) : '')
        +   chip('POST /mcp')
        +   chip('GET /sse')
        + '</div>'
        + '</div>';
    }

    p.innerHTML = html;

    // ── Sidebar: Config summary ─────────────────────────────────
    const sb = document.getElementById('sidebar');
    let shtml = '';

    // Pipeline overview
    shtml += '<div class="node" style="margin-bottom:16px">'
      + '<div class="node-header"><span class="node-badge badge-config">Config</span>'
      + '<span class="node-title">Pipeline Summary</span></div>';

    const rows = [
      ['Handlers', cfg.handlers ? cfg.handlers.length : 0],
      ['Tools', cfg.tools ? cfg.tools.length : 0],
      ['LLM', cfg.llm.type],
      ['Agent max steps', cfg.agent.maxSteps],
      ['Agent timeout', cfg.agent.timeoutMs + 'ms'],
      ['HTTP port', cfg.http.port],
      ['HTTP route', cfg.http.route],
      ['Case ID field', cfg.schema.caseIdField],
    ];

    rows.forEach(([k, v]) => {
      shtml += '<div class="config-row">'
        + '<span class="config-key">' + esc(k) + '</span>'
        + '<span class="config-val">' + esc(String(v)) + '</span>'
        + '</div>';
    });
    shtml += '</div>';

    // MCP status
    if (cfg.mcp) {
      shtml += '<div class="node" style="margin-bottom:16px">'
        + '<div class="node-header"><span class="node-badge badge-mcp">MCP</span>'
        + '<span class="node-title">MCP Server</span></div>';
      const mcpRows = [
        ['Status', cfg.mcp.enabled ? '● Enabled' : '○ Disabled'],
        ['Port', cfg.mcp.port],
        ['Base path', cfg.mcp.basePath || '(root)'],
      ];
      mcpRows.forEach(([k, v]) => {
        shtml += '<div class="config-row">'
          + '<span class="config-key">' + esc(k) + '</span>'
          + '<span class="config-val">' + esc(String(v)) + '</span>'
          + '</div>';
      });
      shtml += '</div>';
    }

    // Event bus addresses
    shtml += '<div class="node">'
      + '<div class="node-header"><span class="node-badge badge-bus">Event Bus</span>'
      + '<span class="node-title">Addresses</span></div>';
    [['inbound', cfg.addresses.inbound],
     ['agent', cfg.addresses.agent],
     ['events', cfg.addresses.events]
    ].forEach(([k, v]) => {
      shtml += '<div class="config-row">'
        + '<span class="config-key">' + esc(k) + '</span>'
        + '<span class="config-val">' + esc(v) + '</span>'
        + '</div>';
    });
    shtml += '</div>';

    sb.innerHTML = shtml;
  }
  window.openToolPanel = function(name) {
    const t = toolDetails[name];
    if (!t) return;
    document.getElementById('tool-panel-title').textContent = t.name;
    const schema = t.schema || {};
    const props = (schema.properties) ? Object.entries(schema.properties) : [];
    const required = new Set(schema.required || []);
    let body = '';
    body += '<div style="margin-bottom:14px;font-size:13px;color:#c9d1d9;line-height:1.6">' + esc(t.description) + '</div>';
    if (props.length) {
      body += '<div style="font-size:12px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Parameters</div>';
      body += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
      body += '<thead><tr style="color:#8b949e;border-bottom:1px solid #30363d">'
        + '<th style="text-align:left;padding:4px 8px 4px 0">Name</th>'
        + '<th style="text-align:left;padding:4px 8px">Type</th>'
        + '<th style="text-align:left;padding:4px 0">Description</th>'
        + '</tr></thead><tbody>';
      props.forEach(([pname, pdef]) => {
        const isReq = required.has(pname);
        const typeStr = pdef.enum ? pdef.enum.join(' | ') : (pdef.type || '');
        body += '<tr style="border-bottom:1px solid #21262d">'
          + '<td style="padding:5px 8px 5px 0;color:#79c0ff;white-space:nowrap">'
          + esc(pname) + (isReq ? ' <span style="color:#f85149">*</span>' : '') + '</td>'
          + '<td style="padding:5px 8px;color:#d2a679;font-family:monospace;white-space:nowrap">' + esc(typeStr) + '</td>'
          + '<td style="padding:5px 0;color:#8b949e">' + esc(pdef.description || '') + '</td>'
          + '</tr>';
      });
      body += '</tbody></table>';
      body += '<div style="font-size:11px;color:#8b949e;margin-top:6px"><span style="color:#f85149">*</span> required</div>';
    }
    document.getElementById('tool-panel-body').innerHTML = body;
    document.getElementById('tool-overlay').style.display = 'block';
    document.getElementById('tool-panel').style.display = 'block';
  };

  window.closeToolPanel = function() {
    document.getElementById('tool-overlay').style.display = 'none';
    document.getElementById('tool-panel').style.display = 'none';
  };

  window.openYaml = function() {
    const drawer = document.getElementById('yaml-drawer');
    const overlay = document.getElementById('yaml-overlay');
    const pre = document.getElementById('yaml-content');
    overlay.style.display = 'block';
    drawer.classList.add('open');
    if (pre.dataset.loaded) return;
    pre.textContent = 'Loading…';
    fetch('/api/pipeline/yaml')
      .then(r => r.text())
      .then(yaml => {
        pre.innerHTML = highlightYaml(yaml);
        pre.dataset.loaded = '1';
      })
      .catch(err => { pre.textContent = 'Error: ' + err; });
  };

  window.closeYaml = function() {
    document.getElementById('yaml-drawer').classList.remove('open');
    document.getElementById('yaml-overlay').style.display = 'none';
  };

  function highlightYaml(src) {
    return src
      .split('\n')
      .map(line => {
        const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        // comment
        if (/^\s*#/.test(line)) return '<span class="yc">' + e(line) + '</span>';
        // key: value
        const m = line.match(/^(\s*)([-\w.]+)(\s*:\s*)(.*)$/);
        if (m) {
          let val = m[4];
          let vs = '';
          if (val === '' || val === undefined) {
            vs = '';
          } else if (/^['"]/.test(val)) {
            vs = '<span class="ys">' + e(val) + '</span>';
          } else if (/^(true|false|null)$/.test(val)) {
            vs = '<span class="yk">' + e(val) + '</span>';
          } else if (/^-?[0-9]/.test(val)) {
            vs = '<span class="yn">' + e(val) + '</span>';
          } else {
            vs = '<span class="yv">' + e(val) + '</span>';
          }
          return e(m[1]) + '<span class="ykey">' + e(m[2]) + '</span>' + e(m[3]) + vs;
        }
        // list item
        if (/^\s*-\s/.test(line)) {
          return line.replace(/^(\s*-\s)(.*)$/, (_, dash, rest) =>
            e(dash) + '<span class="yv">' + e(rest) + '</span>');
        }
        return e(line);
      })
      .join('\n');
  }

})();
</script>
</body>
</html>
